// Config for lineup practice

// Server setup
sv_cheats 1
sv_infinite_ammo 1
mp_buy_anywhere 1
inferno_damage 0
inferno_damage_ct 0

echo Lineup Keybinds:

// noclip
bind scancode17 noclip
sv_noclipspeed 1500
echo n: Noclip (speed is now 1500)

// Rethrow last grenade
bind scancode13 sv_rethrow_last_grenade
echo j: Rethrow last grenade

// Clear smokes
bind scancode14 "ent_fire smokegrenade_projectile kill"
echo k: Clear smokes

// Clear fire grenades
bind scancode15 "ent_fire inferno kill"
echo l: Clear fire grenades